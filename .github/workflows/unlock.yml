name: Unpack and Unlock Firmware

on:
  workflow_dispatch:

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Environment
        run: |
          sudo apt-get update
          # تثبيت الأدوات الضرورية مباشرة (mtd-utils يحتوي على أدوات فك UBI)
          sudo apt-get install -y mtd-utils squashfs-tools binwalk

      - name: Extract Firmware
        run: |
          tar -xvf one-newlg7200.tar.gz
          # بما أن binwalk فشل في فك UBI، سنستخدم أمر فك مباشر
          # نستخدم ubidump ثم نحولها لـ squashfs
          mkdir -p extracted_rootfs
          # هذا أمر بديل لفك ملفات UBI
          sudo binwalk -e one-newlg7200/ubi.bin
          
          # التحقق من مكان وجود الملفات المفككة
          ls -R
          
          # البحث عن أي مجلد يحتوي على ملفات النظام (مثل bin, etc, usr)
          # ونقوم بنقله للمجلد المستهدف
          find . -name "etc" -type d -exec dirname {} \; | head -n 1 > path.txt
          mv $(cat path.txt)/* extracted_rootfs/

      - name: Unlock and Customize
        run: |
          # 1. فتح الـ SSH
          sudo sed -i 's/^root:[^:]*:/root::/' extracted_rootfs/etc/shadow
          
          # 2. ضمان وجود ملف config
          mkdir -p extracted_rootfs/etc/config
          echo "config dropbear 'lan'" > extracted_rootfs/etc/config/dropbear
          echo "    option Interface 'lan'" >> extracted_rootfs/etc/config/dropbear
          echo "    option PasswordAuth 'on'" >> extracted_rootfs/etc/config/dropbear
          
      - name: Repack Firmware
        run: |
          # إعادة التغليف
          mksquashfs extracted_rootfs/ final_unlocked.bin -comp xz
          
      - name: Upload Unlocked Firmware
        uses: actions/upload-artifact@main
        with:
          name: Unlocked_Firmware_GAPD7200
          path: final_unlocked.bin
