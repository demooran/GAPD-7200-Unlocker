name: Unpack and Unlock Firmware

on:
  workflow_dispatch:

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk squashfs-tools
          
      - name: Extract Firmware
        run: |
          tar -xvf one-newlg7200.tar.gz
          # فك ملف الـ ubi باستخدام binwalk
          # -e تعني استخراج، -M تعني فك تلقائي
          binwalk -e one-newlg7200/ubi.bin
          
          # البحث عن المجلد المستخرج (عادة ما يكون داخل مجلد يبدأ بـ _ubi.bin.extracted)
          # سنقوم بنقله لمسار ثابت
          mv _ubi.bin.extracted/squashfs-root extracted_rootfs

      - name: Unlock and Customize
        run: |
          cd extracted_rootfs
          
          # 1. فتح الـ SSH (تعطيل كلمة السر لـ root)
          sudo sed -i 's/^root:[^:]*:/root::/' etc/shadow
          
          # 2. إنشاء إعدادات SSH
          mkdir -p etc/config
          echo "config dropbear 'lan'" > etc/config/dropbear
          echo "    option Interface 'lan'" >> etc/config/dropbear
          echo "    option PasswordAuth 'on'" >> etc/config/dropbear
          
      - name: Repack Firmware
        run: |
          # إعادة التغليف
          mksquashfs extracted_rootfs/ final_unlocked.bin -comp xz
          
      - name: Upload Unlocked Firmware
        uses: actions/upload-artifact@main
        with:
          name: Unlocked_Firmware_GAPD7200
          path: final_unlocked.bin
