name: Unpack and Unlock Firmware

on:
  workflow_dispatch:

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk squashfs-tools python3-pip
          # تثبيت ubireader مباشرة عبر pip (هذه الطريقة أضمن)
          sudo pip3 install ubireader

      - name: Extract Firmware
        run: |
          tar -xvf one-newlg7200.tar.gz
          # عرض محتويات المجلد للتأكد من المسار
          ls -R one-newlg7200/
          # محاولة الفك (بافتراض أن الملف هو ubi.bin)
          ubireader_extract_files one-newlg7200/ubi.bin -o extracted_rootfs

      - name: Unlock and Customize
        run: |
          # الانتقال للمسار الذي تنشئه الأداة تلقائياً
          # عادة ubireader تضع الملفات في مجلد باسم الصورة
          cd extracted_rootfs/ubi_ubi.bin/squashfs-root
          
          # 1. فتح الـ SSH
          sudo sed -i 's/^root:[^:]*:/root::/' etc/shadow
          
          # 2. إضافة إعدادات الـ SSH
          echo "config dropbear 'lan'" > etc/config/dropbear
          echo "    option Interface 'lan'" >> etc/config/dropbear
          echo "    option PasswordAuth 'on'" >> etc/config/dropbear
          
      - name: Repack Firmware
        run: |
          # إعادة التغليف
          mksquashfs extracted_rootfs/ubi_ubi.bin/squashfs-root/ final_unlocked.bin -comp xz
          
      - name: Upload Unlocked Firmware
        uses: actions/upload-artifact@main
        with:
          name: Unlocked_Firmware_GAPD7200
          path: final_unlocked.bin
