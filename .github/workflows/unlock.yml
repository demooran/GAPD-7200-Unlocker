name: Unpack and Unlock Firmware

on:
  workflow_dispatch:

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk squashfs-tools git python3-setuptools
          # تثبيت ubireader مباشرة من المصدر لضمان التوافق
          git clone https://github.com/jrspruitt/ubi_reader
          cd ubi_reader
          sudo python3 setup.py install

      - name: Extract Firmware
        run: |
          tar -xvf one-newlg7200.tar.gz
          # التحقق من وجود الملف قبل البدء
          ls -l one-newlg7200/ubi.bin
          ubireader_extract_files one-newlg7200/ubi.bin -o extracted_rootfs

      - name: Unlock and Customize
        run: |
          # الدخول للمجلد المستخرج (عادة ما يكون داخل مجلد فرعي بعد فك الـ UBI)
          cd extracted_rootfs/ubi_ubi.bin/squashfs-root
          
          # 1. تعطيل كلمة المرور
          sudo sed -i 's/^root:[^:]*:/root::/' etc/shadow
          
          # 2. ضمان تفعيل SSH
          echo "config dropbear 'lan'" > etc/config/dropbear
          echo "    option Interface 'lan'" >> etc/config/dropbear
          echo "    option PasswordAuth 'on'" >> etc/config/dropbear
          
      - name: Repack Firmware
        run: |
          # إعادة التغليف باستخدام squashfs
          mksquashfs extracted_rootfs/ubi_ubi.bin/squashfs-root/ final_unlocked.bin -comp xz
          
      - name: Upload Unlocked Firmware
        uses: actions/upload-artifact@main
        with:
          name: Unlocked_Firmware_GAPD7200
          path: final_unlocked.bin
