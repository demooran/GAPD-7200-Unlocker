name: Unpack and Unlock Firmware

on:
  workflow_dispatch:

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Extract Firmware
        run: |
          tar -xvf one-newlg7200.tar.gz
          # نبحث عن ملف squashfs داخل الـ ubi.bin مباشرة
          # سنستخدم أمر dd لمحاولة إيجاد بداية نظام الملفات (عادة تبدأ بـ hsqs)
          # ثم نفكها مباشرة باستخدام unsquashfs
          
          # ملاحظة: هذا الأمر قد يحتاج تجربة، سنحاول البحث عن السلسلة السحرية للملف
          OFFSET=$(grep -aob "hsqs" one-newlg7200/ubi.bin | head -1 | cut -d: -f1)
          dd if=one-newlg7200/ubi.bin bs=1 skip=$OFFSET of=filesystem.squashfs
          
          mkdir -p extracted_rootfs
          unsquashfs -d extracted_rootfs filesystem.squashfs

      - name: Unlock and Customize
        run: |
          # 1. فتح الـ SSH
          # تغيير ملف shadow (تعطيل كلمة المرور)
          if [ -f extracted_rootfs/etc/shadow ]; then
            sudo sed -i 's/^root:[^:]*:/root::/' extracted_rootfs/etc/shadow
          fi
          
          # 2. ضمان تفعيل dropbear
          mkdir -p extracted_rootfs/etc/config
          echo "config dropbear 'lan'" > extracted_rootfs/etc/config/dropbear
          echo "    option Interface 'lan'" >> extracted_rootfs/etc/config/dropbear
          echo "    option PasswordAuth 'on'" >> extracted_rootfs/etc/config/dropbear

      - name: Repack Firmware
        run: |
          # إعادة التغليف
          mksquashfs extracted_rootfs/ final_unlocked.bin -comp xz
          
      - name: Upload Unlocked Firmware
        uses: actions/upload-artifact@main
        with:
          name: Unlocked_Firmware_GAPD7200
          path: final_unlocked.bin
